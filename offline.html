<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1424" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <title>You are offline · Electrosparkzz</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #e8eefc;
        background: radial-gradient(900px 500px at 50% -10%, #17335a, transparent 70%), #0d1424; text-align: center; }
      main { max-width: 420px; display: grid; gap: 14px; justify-items: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 24px; margin: 6px 0 0; }
      p { margin: 0; color: #a9b8d4; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
      a, button { font: inherit; border-radius: 999px; padding: 10px 18px; border: 1px solid #3b5a86; color: #e8eefc; background: #15243d; text-decoration: none; cursor: pointer; }
      a.primary, button.primary { background: #38bdf8; color: #06202f; border-color: #38bdf8; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>The town needs a connection to meet everyone live. Pages you opened before are still saved on this device.</p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Try again</button>
        <a href="/book.html">Read the book</a>
      </div>
    </main>
  </body>
</html>
