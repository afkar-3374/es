# Publishes electrosparkzz.in: the shared 3D town is the home page, the book pages sit beside it
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: world/package-lock.json
      - name: Build the 3D town
        working-directory: world
        run: |
          npm ci
          npm run build
      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'world' --exclude '_site' ./ _site/
          cp -r world/dist/. _site/
          # the town used to live at /world: send old links home
          mkdir -p _site/world
          printf '<!doctype html><meta charset="utf-8"><title>Electrosparkzz Town</title><meta http-equiv="refresh" content="0; url=/"><link rel="canonical" href="https://electrosparkzz.in/"><a href="/">Electrosparkzz Town</a>\n' > _site/world/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
